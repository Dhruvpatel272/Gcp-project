apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcp-devops-gke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gcp-devops-gke
  template:
    metadata:
      labels:
        app: gcp-devops-gke
    spec:
      containers:
      - name: gcp-devops-container
        # --- THIS IS THE FIX ---
        # The full, hardcoded image path.
        # This matches the --image flag in cloudbuild.yaml
        image: gcr.io/ambient-inquiry-473611-t8/gcpdevops
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
---

apiVersion: "v1"
kind: "Service"
metadata:
    name: "gcp-devops-gke-service"
    namespace: "gcp-devops-project"
    labels:
      app.kubernetes.io/managed-by: "gcp-cloud-build-deploy"
spec:
  ports:
    - protocol: "TCP"
      port: 80
      targetPort: 5000
  selector:
    app: "gcp"
  type: "LoadBalancer"

